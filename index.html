<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCC-Ai | منصة التداول الكمي الذكية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .gradient-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <!-- Header Section -->
    <header class="w-full max-w-4xl mx-auto flex justify-between items-center py-4 border-b border-slate-700 mb-6">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-blue-500/30">
                FCC
            </div>
            <div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-400">FCC-Ai Platform</h1>
                <p class="text-xs text-slate-400">التداول الكمي بالذكاء الاصطناعي</p>
            </div>
        </div>
        <div id="user-status" class="text-xs text-slate-400">
            <!-- سيتم عرضه ديناميكياً -->
        </div>
    </header>

    <!-- Main Registration & Referral Handler Container -->
    <main class="w-full max-w-md mx-auto my-auto">
        <div class="gradient-card rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            
            <!-- Referral Alert Banner -->
            <div id="referral-banner" class="hidden mb-4 p-3 bg-blue-900/40 border border-blue-500/30 rounded-xl text-xs text-blue-300 flex items-center gap-2">
                <i class="fa-solid fa-user-plus text-blue-400 text-base"></i>
                <span>لقد تمت دعوتك للانضمام عبر رابط دعوة خاص برمز: <strong id="ref-code-display" class="text-white">---</strong></span>
            </div>

            <!-- Error Banner -->
            <div id="error-message" class="hidden mb-4 p-3 bg-red-900/40 border border-red-500/30 rounded-xl text-xs text-red-300 flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-red-400 text-base"></i>
                <span id="error-text">حدث خطأ أثناء معالجة الطلب.</span>
            </div>

            <h2 class="text-2xl font-bold text-center mb-2">إنشاء حساب جديد</h2>
            <p class="text-xs text-slate-400 text-center mb-6">انضم إلى منصة FCC-Ai واستمتع بأعلى العوائد التداولية</p>

            <form id="signup-form" class="space-y-4" onsubmit="handleSignUp(event)">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="example@domain.com" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:border-blue-500 transition-all">
                </div>

                <div>
                    <label class="block text-xs text-slate-300 mb-1">كلمة السر</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:border-blue-500 transition-all">
                </div>

                <!-- Hidden / Readonly Referral Code Input -->
                <div>
                    <label class="block text-xs text-slate-300 mb-1">رمز الدعوة (إجباري)</label>
                    <input type="text" id="referral-code" placeholder="رمز الدعوة تلقائي" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-blue-400 font-mono text-sm focus:outline-none" readonly>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm transition-all shadow-lg shadow-blue-600/20 active:scale-95">
                    تأكيد التسجيل الان
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-400">لديك حساب بالفعل؟ <a href="#" class="text-blue-400 hover:underline">تسجيل الدخول</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-4xl mx-auto text-center py-4 text-xs text-slate-500 border-t border-slate-800/60 mt-6">
        &copy; 2026 FCC-Ai Quantitative Platform. جميع الحقوق محفوظة.
    </footer>

    <!-- Logic Script -->
    <script>
        // 1. التقاط رمز الإحالة والدعوة من URL وضمان تخزينه
        function initReferralSystem() {
            const urlParams = new URLSearchParams(window.location.search);
            let refCode = urlParams.get('ref') || urlParams.get('invite') || urlParams.get('code');

            // حفظ الرمز في Storage لحمايته من الإنعاش أو الضياع
            if (refCode) {
                localStorage.setItem('fcc_ref_code', refCode);
            } else {
                refCode = localStorage.getItem('fcc_ref_code');
            }

            const refInput = document.getElementById('referral-code');
            const refBanner = document.getElementById('referral-banner');
            const refDisplay = document.getElementById('ref-code-display');

            if (refCode) {
                refInput.value = refCode;
                refDisplay.innerText = refCode;
                refBanner.classList.remove('hidden');
            } else {
                refInput.value = "FCC-OFFICIAL"; // كود دعوة افتراضي للمنصة لمنع الخطأ
            }
        }

        // 2. إظهار وتنسيق أخطاء التسجيل
        function showError(msg) {
            const errBox = document.getElementById('error-message');
            const errText = document.getElementById('error-text');
            errText.innerText = msg;
            errBox.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error-message').classList.add('hidden');
        }

        // 3. معالجة التسجيل
        async function handleSignUp(e) {
            e.preventDefault();
            hideError();

            const submitBtn = document.getElementById('submit-btn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const refCode = document.getElementById('referral-code').value;

            if (!email || !password) {
                showError("يرجى تعبئة جميع الحقول المطلوب.");
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "جاري إنشاء الحساب...";

                // محاكاة الاتصال / أو ربط Supabase/Firebase المسجل بالمشروع
                console.log("تسجيل حساب جديد:", { email, refCode });

                /* 
                 إذا كنت تستخدم Supabase يمكنك تفعيل التالي:
                 const { data, error } = await supabase.auth.signUp({
                     email: email,
                     password: password,
                     options: {
                         data: { referred_by: refCode }
                     }
                 });
                 if (error) throw error;
                */

                // تنظيف ذاكرة التخزين المؤقت للإحالة بعد النجاح
                localStorage.removeItem('fcc_ref_code');
                
                alert("تم تسجيل الحساب بنجاح في FCC-Ai! جاري تحويلك...");
                // window.location.href = "/dashboard.html";

            } catch (err) {
                showError(err.message || "حدث خطأ غير متوقع أثناء التسجيل باستخدام رابط الدعوة.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد التسجيل الان";
            }
        }

        // تشغيل التهيئة فور تحميل الصفحة
        window.addEventListener('DOMContentLoaded', initReferralSystem);
    </script>
</body>
</html>
